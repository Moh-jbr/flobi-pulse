# Publishing a new version:   npm version patch   then   git push --follow-tags
#
# The pushed tag (v1.2.3) builds Windows, macOS and Linux in parallel and publishes
# a GitHub release. Installed apps see it on their next start, when their window
# is focused, or within the hour, and show "Update available".
#
# Cost: $0. The repo is public, and public repos get GitHub's standard runners
# (ubuntu-24.04, windows-latest, macos-latest) for free. Don't switch to larger
# runners, which are billed even on public repos, and don't make the repo private.
name: Release

on:
  push:
    tags: ['v*.*.*']

# Read-only by default. The build jobs run third-party code (npm ci, the tests,
# electron-builder), so they never hold a token that can write to the repo; only
# the publish job, which runs nothing from npm, may create the release.
# Actions are pinned to full commit SHAs (the tag they came from is in the comment),
# so a moved or hijacked tag can't swap in different code.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, target: win }
          - { name: macOS, os: macos-latest, target: mac }
          # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19. Move up on purpose,
          # after a test build, not because the label changed underneath a release.
          - { name: Linux, os: ubuntu-24.04, target: linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false # don't leave the token in .git/config for the steps below

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $v. Use 'npm version patch' to make both."
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npx vite build

      # No paid signing certificates: Windows builds unsigned, macOS gets a free
      # ad-hoc signature (package.json → build.mac.identity "-").
      - run: npx electron-builder --${{ matrix.target }} --publish never

      - run: node scripts/package-downloader.mjs ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: upload/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: upload
          merge-multiple: true

      - name: Checksums (the app checks them before installing an update)
        working-directory: upload
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          **Download for your computer**, unzip it and follow READ ME FIRST.txt:
          - Windows: [Flobi-Pulse-Windows.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Flobi-Pulse-Windows.zip)
          - macOS (Apple Silicon and Intel): [Flobi-Pulse-macOS.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Flobi-Pulse-macOS.zip)
          - Linux (x64): [Flobi-Pulse-Linux.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Flobi-Pulse-Linux.zip)

          Already installed? The app updates itself: click **Update available** at the top.
          EOF
          gh release create "$GITHUB_REF_NAME" upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flobi Pulse ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --generate-notes
